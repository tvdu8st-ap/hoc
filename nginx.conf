# Cấu hình Nginx Reverse Proxy & SSL cho Góc Lắng Nghe
# Đặt tại: /etc/nginx/sites-available/goclangnghe.conf

# Giới hạn tần suất yêu cầu chống DoS / brute-force
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=track_limit:10m rate=5r/s;

# Chuyển hướng HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name goclangnghe.truonghoc.edu.vn;

    # Hỗ trợ xác thực Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Cấu hình HTTPS an toàn
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goclangnghe.truonghoc.edu.vn;

    # Chứng chỉ SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/goclangnghe.truonghoc.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goclangnghe.truonghoc.edu.vn/privkey.pem;

    # TLS Protocols & Ciphers theo chuẩn hiện đại
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Giới hạn kích thước payload (chống DoS tải tệp lớn)
    client_max_body_size 5M;

    # API endpoints với rate limit
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # API tra cứu nhạy cảm với rate limit chặt chẽ hơn
    location /api/counseling/track/ {
        limit_req zone=track_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phục vụ ứng dụng web
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
