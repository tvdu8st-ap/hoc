version: '3.8'

services:
  # ==========================================
  # CƠ SỞ DỮ LIỆU POSTGRESQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: goclangnghe-db
    restart: always
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-school_counseling}
      POSTGRES_USER: ${SQL_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${SQL_ADMIN_PASSWORD:-PostgresSecretPass2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations/0_init/migration.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_ADMIN_USER:-postgres} -d ${SQL_DB_NAME:-school_counseling}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # ỨNG DỤNG GÓC LẮNG NGHE (NODE.JS + REACT)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goclangnghe-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET:-random-production-hmac-key-min-32-chars-long}
      SQL_HOST: postgres
      SQL_DB_NAME: ${SQL_DB_NAME:-school_counseling}
      SQL_USER: ${SQL_ADMIN_USER:-postgres}
      SQL_PASSWORD: ${SQL_ADMIN_PASSWORD:-PostgresSecretPass2026!}
      SQL_ADMIN_USER: ${SQL_ADMIN_USER:-postgres}
      SQL_ADMIN_PASSWORD: ${SQL_ADMIN_PASSWORD:-PostgresSecretPass2026!}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
